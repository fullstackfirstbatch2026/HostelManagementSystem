spring.application.name=HostelManagementSystem

spring.datasource.url=jdbc:mysql://localhost:3306/hostel_management_db?serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Hostel@12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8081

spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=60000

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

# Application information
info.app.name=Hostel Management System
info.app.description=Hostel management backend
info.app.version=1.0.0